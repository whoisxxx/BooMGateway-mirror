# 安全审计 — 漏洞扫描 + 依赖检查
# TODO: 当前为占位，后续接入 cargo-audit + cargo-deny
#
# 触发条件:
#   - 每次 PR (检查新依赖是否引入漏洞)
#   - 每周一定时扫描 (全量审计)
name: Security Audit

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  schedule:
    - cron: "0 9 * * 1" # 每周一 09:00 UTC
  workflow_dispatch:

jobs:
  audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true

      - name: Run cargo audit
        # yanked crates 不是安全漏洞（只是版本被作者撤回），不应阻断 CI
        # 真正的 RUSTSEC 漏洞才阻断；用 grep 区分两类输出
        run: |
          if [ ! -f "Cargo.lock" ]; then
            echo "::notice::Cargo.lock not found, generating..."
            cargo generate-lockfile
          fi
          # 运行审计，捕获输出
          set +e
          cargo audit 2>&1 | tee audit-output.txt
          # 检查是否有真正的漏洞 (RUSTSEC advisory)，yanked 只算 warning
          if grep -E "^(error|warning):.*vulnerabilities found" audit-output.txt; then
            echo "❌ 安全漏洞被发现，CI 失败"
            exit 1
          fi
          echo "✅ 无安全漏洞 (yanked crates 仅作 warning，不阻断)"

