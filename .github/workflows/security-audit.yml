# 安全审计 — 漏洞扫描 + 依赖检查
# TODO: 当前为占位，后续接入 cargo-audit + cargo-deny
#
# 触发条件:
#   - 每次 PR (检查新依赖是否引入漏洞)
#   - 每周一定时扫描 (全量审计)
name: Security Audit

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  schedule:
    - cron: "0 9 * * 1" # 每周一 09:00 UTC
  workflow_dispatch:

jobs:
  audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true

      - name: Run cargo audit
        run: |
          if [ -f "Cargo.lock" ]; then
            cargo audit
          else
            echo "::notice::Cargo.lock not found, generating..."
            cargo generate-lockfile
            cargo audit
          fi

