# 编译构建门禁
# 职责：cargo build (workspace) + 独立 crate 编译 (misc/LB, hook, bench-client, mock-backend)
name: CI Build

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Job 1: workspace 编译 ──
  build-workspace:
    name: Build workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpq-dev protobuf-compiler cmake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-build-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-build-${{ runner.os }}-

      - name: Build (workspace, release)
        run: cargo build --workspace --release

  # ── Job 2: 独立子项目编译 ──
  build-standalone:
    name: Build standalone crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpq-dev protobuf-compiler cmake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            misc/LB/target
            hook/target
            boom-gateway/test/bench-client/target
            boom-gateway/test/mock-backend/target
          key: cargo-standalone-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: cargo-standalone-${{ runner.os }}-

      - name: Build misc/LB
        run: cd misc/LB && cargo build --release

      - name: Build hook SDK demo
        run: cd hook && cargo build --release

      - name: Build bench-client
        run: cd boom-gateway/test/bench-client && cargo build --release

      - name: Build mock-backend
        run: cd boom-gateway/test/mock-backend && cargo build --release

      - name: Upload bench-client binary
        uses: actions/upload-artifact@v4
        with:
          name: bench-client-bin
          path: boom-gateway/test/bench-client/target/release/bench-client
          retention-days: 1

      - name: Upload mock-backend binary
        uses: actions/upload-artifact@v4
        with:
          name: mock-backend-bin
          path: boom-gateway/test/mock-backend/target/release/mock-backend
          retention-days: 1
